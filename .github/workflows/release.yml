name: Release

# Цепочка поставки после мержа PR в main: сперва проверки безопасности
# (переиспользуют jobs из security.yml) и тесты, и только если оба блока
# зелёные — сборка и публикация docker-образа в GitHub Container Registry.
on:
  push:
    branches: [ main ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security:
    name: Security & Supply Chain Checks
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      issues: write

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --verbose --locked

  docker:
    name: Build & Push Docker Image
    needs: [ security, test ]
    runs-on: ubuntu-latest
    # environment с required reviewers ставит джобу на паузу до ручного
    # подтверждения в Actions UI (см. Settings → Environments → release).
    environment: release
    # Сборка arm64 идёт через QEMU-эмуляцию (нативных arm64-раннеров нет),
    # компиляция Rust под эмуляцией заметно медленнее amd64.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (GHCR требует lowercase)
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
